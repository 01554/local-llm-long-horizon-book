<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR コード生成器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .qr-container {
            margin-top: 30px;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .qr-container.show {
            display: flex;
        }

        #qrcode {
            padding: 16px;
            background: white;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #qrcode img {
            display: block;
            border-radius: 4px;
        }

        .download-btn {
            padding: 12px 24px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #218838;
        }

        .error {
            color: #dc3545;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔳 QR コード生成器</h1>
        
        <div class="input-group">
            <label for="urlInput">URL またはテキストを入力</label>
            <input 
                type="text" 
                id="urlInput" 
                placeholder="https://example.com"
                autocomplete="off"
            >
            <span class="error" id="errorMessage"></span>
        </div>

        <button onclick="generateQR()">QR コードを生成</button>

        <div class="qr-container" id="qrContainer">
            <div id="qrcode"></div>
            <button class="download-btn" onclick="downloadQR()">ダウンロード</button>
        </div>
    </div>

    <script>
        let qrcode = null;

        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateQR();
            }
        });

        function generateQR() {
            const input = document.getElementById('urlInput');
            const errorMessage = document.getElementById('errorMessage');
            const qrContainer = document.getElementById('qrContainer');
            
            const url = input.value.trim();
            
            if (!url) {
                showError('URL またはテキストを入力してください');
                return;
            }

            try {
                new URL(url);
            } catch (e) {
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    showError('有効な URL を入力してください（例：https://example.com）');
                    return;
                }
            }

            errorMessage.classList.remove('show');
            
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = '';
            
            qrcode = new QRCode(qrDiv, {
                text: url,
                width: 200,
                height: 200,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            qrContainer.classList.add('show');
        }

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.show();
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            if (img && img.src) {
                const link = document.createElement('a');
                link.href = img.src;
                link.download = 'qrcode-' + Date.now() + '.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
    </script>
</body>
</html>
